name: SENTINELA V0.4 validation
on:
  push:
    branches:
      - feature/sentinela-v04-visual
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python syntax and unit tests
        run: |
          python -m py_compile scripts/collect.py
          python -m unittest discover -s tests -v
      - name: Browser JS syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("docs/index.html").read_text()
          if "<script>" not in html or "</script>" not in html: raise SystemExit("Missing dashboard JavaScript")
          Path("/tmp/sentinela-v04.js").write_text(html.split("<script>",1)[1].split("</script>",1)[0])
          PY
          node --check /tmp/sentinela-v04.js
      - name: Visual asset references
        run: |
          python - <<'PY'
          from pathlib import Path
          html=Path("docs/index.html").read_text()
          assert "solarImage('aia','0193')" in html
          assert "solarImage('hmi','HMII')" in html
          assert "flare_history" in html
          assert "kpChart" in html and "flareChart" in html
          print("Visual references: OK")
          PY

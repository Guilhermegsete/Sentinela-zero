name: SENTINELA collect
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/collect.py'
      - 'docs/index.html'
      - 'docs/dashboard.js'
      - '.github/workflows/update.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
concurrency:
  group: sentinela-collect
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    # Manual runs on a review branch must not save data or publish anything.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; Node 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0; Node 24
        with:
          python-version: '3.12'
      - name: Collect observations and diagnostic
        id: collect
        continue-on-error: true
        run: python scripts/collect.py
      - name: Save snapshot including degraded status
        if: ${{ !cancelled() && steps.collect.outcome != 'skipped' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m 'data: refresh public feeds and health'
            # A concurrent main update must reject the push. Rerun on the latest
            # main instead of rebasing or overwriting an ambiguous snapshot.
            git push
          fi
      - name: Report degraded collection
        if: ${{ !cancelled() && steps.collect.outcome == 'failure' }}
        run: |
          echo "::error::Collection degraded or failed; inspect source status in docs/data.json and collection logs."
          exit 1


name: SENTINELA temporary RSS reachability check
on:
  push:
    branches: [codex/geopolitical-news-sources-filters]
    paths:
      - '.github/workflows/check-news-feeds-temp.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check RSS sources via public HTTP
        run: |
          python - <<'PY'
          import urllib.request, xml.etree.ElementTree as ET
          feeds = {
             "BBC World": "https://feeds.bbci.co.uk/news/world/rss.xml",
             "Al Jazeera": "https://www.aljazeera.com/xml/rss/all.xml",
             "Deutsche Welle": "https://rss.dw.com/xml/rss-en-all",
             "France 24": "https://www.france24.com/en/rss",
             "The Guardian": "https://www.theguardian.com/world/rss",
             "Euronews": "https://www.euronews.com/rss",
          }
          bad=[]
          for name,url in feeds.items():
              try:
                  req=urllib.request.Request(url,headers={"User-Agent":"SentinelaZero/0.4.1"})
                  with urllib.request.urlopen(req,timeout=15) as response:
                      data=response.read(1000000)
                      code=response.status
                  root=ET.fromstring(data)
                  items=root.findall("./channel/item")
                  print(f"{name}: HTTP {code}; XML root {root.tag}; RSS items {len(items)}",flush=True)
                  if root.tag!="rss" or not items:
                      bad.append(name+" invalid or empty RSS")
              except Exception as exc:
                  print(f"{name}: FAIL {type(exc).__name__}: {exc}",flush=True)
                  bad.append(name)
          if bad:
              print("FEEDS TO FIX:",", ".join(bad))
              raise SystemExit(1)
          PY